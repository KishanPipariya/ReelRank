name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and test tools
        run: uv sync --locked --group dev

      - name: Validate site username configuration
        run: uv run --locked python -c "import json; u=json.load(open('web/site-config.json'))['letterboxd_username']; assert isinstance(u, str) and u.strip(), 'Set a Letterboxd username in web/site-config.json'"

      - name: Run parser and snapshot checks
        run: uv run --locked pytest

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser dependencies
        run: npm ci

      - name: Run browser logic tests
        run: npm test

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Run browser accessibility checks
        run: |
          python3 -m http.server 4173 --directory web >/tmp/reelrank-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/site-config.json >/dev/null; then break; fi
            sleep 1
          done
          npm run check:browser

      - name: Upload desktop and mobile visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-review
          path: /tmp/reelrank-visual-*.png
          if-no-files-found: ignore

      - name: Upload browser diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            /tmp/reelrank-*.png
            /tmp/reelrank-*.zip
            /tmp/reelrank-site.log
          if-no-files-found: ignore
