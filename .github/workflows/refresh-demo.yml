name: Refresh Reelrank demo snapshot

on:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-reelrank-demo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Reelrank
        run: python -m pip install .

      - name: Restore TMDB film metadata cache
        uses: actions/cache@v4
        with:
          path: .reelrank-cache
          key: ${{ runner.os }}-tmdb-film-metadata-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-tmdb-film-metadata-v1-

      - name: Refresh snapshot
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: reelrank-snapshot --username intelkishan --output web/data/snapshot.json

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- web/data/snapshot.json; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/snapshot.json
          git commit -m "Refresh Reelrank demo snapshot"
          git push
