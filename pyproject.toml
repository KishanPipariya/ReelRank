[project]
name = "letterboxd"
version = "0.1.0"
description = "Rank movies across your liked Letterboxd lists"
readme = "README.md"
authors = [
    { name = "Kishan Pipariya", email = "intelkishan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "httpx>=0.28.0",
]

[project.scripts]
letterboxd = "letterboxd:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0.0"]
